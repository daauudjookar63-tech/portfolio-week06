<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420"><rect width="640" height="420" fill="#d5dfdf"/><rect x="62" y="52" width="516" height="320" rx="12" fill="#f6f5ee"/><rect x="62" y="52" width="516" height="46" rx="10" fill="#1b342e"/><text x="87" y="81" font-family="Arial, sans-serif" font-size="17" fill="#ffffff">practice.py</text><rect x="83" y="120" width="475" height="221" rx="7" fill="#253e38"/><text x="106" y="160" font-family="Arial, sans-serif" font-size="20" fill="#e3edda"># One small step at a time</text><text x="106" y="205" font-family="Arial, sans-serif" font-size="20" fill="#e3edda">name = &quot;Daud&quot;</text><text x="106" y="246" font-family="Arial, sans-serif" font-size="20" fill="#e3edda">print(&quot;Hello,&quot;, name)</text><text x="106" y="299" font-family="Arial, sans-serif" font-size="20" fill="#e3edda">&gt; Hello, Daud</text></svg>